<div id="modal-container">
    <div class="modal-overlay">
        <div class="modal">

            <h2>Confirm Save</h2>

            <p>
                The following quantities differ from the stored values:
            </p>

            <table>
                <tr>
                    <th>Part</th>
                    <th>Current</th>
                    <th>Stored</th>
                </tr>

                {% for diff in differences %}
                <tr>
                    <td>{{ diff.name }}</td>
                    <td>{{ diff.form_quantity }}</td>
                    <td>{{ diff.stored_quantity }}</td>
                </tr>
                {% endfor %}
            </table>

            <div class="button-row">
                <button
                    hx-post="/confirm_save"
                    hx-include="#full-build-form"
                    hx-target="#modal-container"
                    hx-swap="innerHTML">
                    Save
                </button>

                <button
                    hx-get="/close_modal"
                    hx-target="#modal-container"
                    hx-swap="innerHTML">
                    Cancel
                </button>
            </div>

        </div>
    </div>
</div>
