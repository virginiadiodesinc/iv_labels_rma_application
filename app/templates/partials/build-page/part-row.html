{% set row_uid = new_uid() %}
<div 
	class="part-row" 
	data-has-existing-lot="{{ 'true' if part and part.part_lot else 'false' }}"
	hx-get="/validate_part_row/"
	hx-include="this"
	hx-trigger="input delay:500ms, load delay:500ms, htmx:afterSwap[target.classList.contains('lot-container')]"
	hx-target="find .part-row-validation-doodad"
	hx-swap="outerHTML"
	hx-disinherit="hx-swap hx-target hx-include">
	<div class="part-row-line-1">
		<div>
			<label>
				Part Type:
				<select
				name="part_type" id="part-type-{{ row_uid }}">
					{% for type in ['CIRCUIT', 'DIODE', 'FILTER MESH', 'MMIC', 'PCB', 'VAC', 
					'BCMESH', 'CONNECTOR', 'MA PARTS', 'MISC', 'SP OTHER',
					 'CABLE', 'FILTER', 'INVENTORY', 'PMP'] %}
					<option {% if part and part.part_type == type %}selected{% endif %}>{{ type }}</option>
					{% endfor %}
				</select>
			</label>
		</div>
		<div>
			<label>
				Part Name:
				<input 
						class="part-row-part-name"
						type="text" 
						name="part" 
						value="{{
								part.part_name
								if part
								else ''
							}}" 
						size="10"
						hx-get="/search_part_lots/"
						hx-trigger="revealed, keyup changed delay:300ms"
						hx-target="next .lot-container"
						hx-include="closest .part-row"
						oninput="sanitizeInput(this, ILLEGAL_FILENAME_CHARACTERS, true)"
						id="part-name-{{ row_uid }}"
						list="part-results-{{ row_uid }}">
				<input type="hidden" name="lot" class="part-row-pending-lot" value="{{ part.part_lot if part else '' }}">
				<datalist 
							id="part-results-{{ row_uid }}"
							hx-get="{{ url_for('jb2.search_jb2_parts') }}"
							hx-trigger="input changed delay:500ms from:#part-name-{{ row_uid }}"
							hx-target="this"
							hx-on::config-request="
								event.detail.parameters['searched-part-name'] = document.getElementById('part-name-{{ row_uid }}').value;
								event.detail.parameters['searched-part-type'] = document.getElementById('part-type-{{ row_uid }}').value;
								">
				</datalist>
			</label>
		</div>
		<div class="part-row-validation-doodad">✓</div>
		<div class="delete-row-button-container">
			<button
				type="button"
				onclick="this.closest('.part-row').remove(); colorBOMAndActualParts()"
				class="delete-row-button">
				X
			</button>
		</div>
	</div>

	<div class="small-line-break"></div>

	<div class="part-row-line-2">
		<div class="lot-container">
			{% if part or (build and build.part_name)%}
				{% include "partials/build-page/lot-input.html" %}
			{% endif %}
		</div>

		<div class="part-row-quantity-container">
			<label>
				Qty:
				<input class="part-row-part-quantity"
						type="number" 
						name="quantity" 
						value="{{ part.quantity | int if part and part.quantity is not none else '1' }}">
			</label>
		</div>

		<div>
			<label>
				Tag:
				<select
				name="part-tag"
				class="part-tag">
					{% for tag in ['NA', '1', '2', '3', 'A', 'B', 'A1', 'A2', 'G1', 'G2', 'G3', 'G4', 'W'] %}
					<option {% if part and part.subassembly_tag == tag %}selected{% endif %}>{{ tag }}</option>
					{% endfor %}
				</select>
			</label>
		</div>
	</div>

	<div class="small-line-break"></div>

	<div class="part-row-line-3">
		<div class="diode-row"
			{% set is_diode = (part and part.part_type == "DIODE") %}
			{% if not is_diode %}style="display:none"{% endif %}>
			{% include "partials/build-page/diode-row.html" %}
		</div>
		<div class="pcb-row"
			{% set is_pcb = (part and part.part_type == "PCB") %}
			{% if not is_pcb %}style="display:none"{% endif %}>
			{% include "partials/build-page/pcb-row.html" %}
		</div>
	</div>
</div>
