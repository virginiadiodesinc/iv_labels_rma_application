<div class="pcb-deviations-container">
	<Label>
		Deviations
		<input class="pcb-deviations-input"
						type="text" 
						name="pcb-deviations-input" 
						value="{{pcb_deviations if pcb_deviations else 'NA'}}">
	</Label>
	<Label>
		SN
		<input class="pcb-sn-input"
						type="text" 
						name="pcb-sn-input" 
						value="{{pcb_sn if pcb_sn else 'NA'}}">
	</Label>
</div>
