<div 
    id="generic-popup"
    class="modal-overlay">
    <div class="modal">
        <p>
            Sorry, there are some non-negotiable errors in the data you're trying to save:
        </p>

        {% for error in errors %}
            <ul>
                {{error}}
            </ul>
        {% endfor %}

        <button
            hx-post="/cancel_generic_dialog/"
            hx-target="#generic-popup"
            hx-swap="outerHTML">
            Cancel
        </button>
    </div>
</div>
