<div 
    id="generic-popup" 
    class="modal-overlay">
    <div class="modal">
        <p>
            Sorry, the following went wrong with saving your data:
        </p>
        <p>
            {{failure_cause}}
        </p>

        <button
            hx-post="/cancel_generic_dialog/"
            hx-target="#generic-popup"
            hx-swap="outerHTML">
            Cancel
        </button>
    </div>
</div>
