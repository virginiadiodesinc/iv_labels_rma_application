<div id="iv-build-info-container" class="iv-build-info-container">
    <label> Block Engraving
        <input type="text"
                oninput="sanitizeInput(this, ILLEGAL_FILENAME_CHARACTERS, true)"
                name="iv-block-engraving"
                value="{{iv_data.block_name | upper if iv_data and iv_data.block_name else ''}}"
                >
    </label>
    <label> Block Serial Number
        <input type="text"
                oninput="sanitizeInput(this, ILLEGAL_FILENAME_CHARACTERS, true)"
                name="iv-block-sn"
                value="{{iv_data.build_sn if iv_data and iv_data.build_sn else ''}}"
                size="7">
    </label>
    <label> Revision Letter
        <input type="text"
                oninput="sanitizeInput(this, ILLEGAL_FILENAME_CHARACTERS, true)"
                name="iv-block-revision"
                value="{{iv_data.build_revision | upper if iv_data and iv_data.build_revision else ''}}"
                size="2">
    </label>
    <br>
    <label> Build Name
        <input type="text"
                oninput="sanitizeInput(this, ILLEGAL_FILENAME_CHARACTERS, true)"
                name="iv-build-name"
                value="{{iv_data.build_name | upper if iv_data and iv_data.build_name else ''}}"
                >
    </label>
    <button
        hx-post="/import_block_identifiers_to_iv/"
        hx-include="#block-info, #full-build-name-input"
        hx-target="#iv-build-info-container"
        hx-swap="innerHTML">
        Get Block Identifiers from Build Side
    </button>
    <br>
    <button 
        class="important-button"
        id="open-iv-button"
        hx-post="/select_iv_from_db/"
        hx-target="#generic-popup"
        hx-swap="outerHTML"
        hx-include="#iv-assembly-information-form"
        hx-disabled-elt="#iv-control-buttons button">
        Search IVs in DB
    </button>
    <span>
        <label> Search By:
            <select hx-preserve id="iv-search-by" name="iv-search-by" class="not-implemented-yet">
                {% for search_option in ["Block ID", "Build Name", "Diode"] %}
                <option value="{{ search_option }}">
                    {{ search_option }}
                </option>
                {% endfor %}
            </select>
        </label>
        <label> Max Responses:
            <select hx-preserve id="iv-search-max-responses" name="iv-search-max-responses" class="not-implemented-yet">
                {% for max_response_count in [10, 25, 50] %}
                    <option value="{{ max_response_count }}">
                        {{ max_response_count }}
                    </option>
                {% endfor %}
            </select>
        </label>
    </span>
</div>
